<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cauca Guardians - Fixed Soundtrack Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --river-deep:#0F3D3E;
    --river-mid:#155E5B;
    --gold:#C9A227;
    --gold-light:#E4C158;
    --danger:#B23A2E;
    --leaf:#4C9A6A;
    --sand:#EDE3D0;
    --ink:#12211F;
    --paper:#F7F2E7;
  }
  *{box-sizing:border-box; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'VT323', monospace;
    font-size:1.18rem;
    background:var(--river-deep);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,#brand-title,.level-tag,.btn,#lang-toggle,.q-count,.shop-btn,.dpad-btn{
    font-family:'Press Start 2P', monospace;
    font-weight:400; margin:0; line-height:1.5;
  }
  button{ font-family:inherit; cursor:pointer; }
  #bg-waves{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 4px),
      linear-gradient(180deg, var(--river-deep) 0%, var(--river-mid) 100%);
  }
  #app{
    position:relative; z-index:1;
    max-width:920px; margin:0 auto;
    min-height:100vh; display:flex; flex-direction:column;
    padding:0 0 40px 0;
  }

  /* HUD */
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; color:var(--sand); gap:10px; flex-wrap:wrap;
  }
  #hud .brand{ display:flex; align-items:center; gap:8px; }
  #hud .brand .mark{
    width:20px;height:20px; background:var(--gold);
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  }
  #hud .brand span{ font-size:0.7rem; }
  #hud .stats{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .stat{ display:flex; align-items:center; gap:6px; font-size:1.1rem; }
  .coin-ic{
    width:16px;height:16px; background: var(--gold);
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
    display:inline-block;
  }
  .healthbar-wrap{ display:flex; align-items:center; gap:6px; }
  .healthbar{
    width:110px; height:12px; background:rgba(247,242,231,0.2);
    border:2px solid var(--ink); overflow:hidden; position:relative;
  }
  .healthbar i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--danger), var(--gold) 50%, var(--leaf));
    transition:width .3s;
  }
  .hud-btn{
    background:rgba(247,242,231,0.15); border:2px solid rgba(247,242,231,0.5);
    color:var(--sand); padding:6px 10px; font-size:0.6rem;
  }
  .hud-btn:hover{ background:rgba(247,242,231,0.3); }
  .hud-btn.shop-btn{ background:var(--gold); color:var(--ink); border-color:var(--ink); font-weight:bold; }

  #active-skills-bar{ display:flex; gap:6px; padding:4px 20px 8px; justify-content:flex-end; }
  .skill-badge{
    background:var(--gold-light); border:1px solid var(--ink);
    color:var(--ink); font-size:0.8rem; padding:2px 6px;
    display:flex; align-items:center; gap:4px;
  }

  .wave-pixel{
    height:12px; width:100%;
    background-image:
      linear-gradient(-45deg, var(--paper) 6px, transparent 0),
      linear-gradient(45deg, var(--paper) 6px, transparent 0);
    background-position:0 0, 6px 0; background-size:12px 12px; background-repeat:repeat-x;
  }

  #screen{
    flex:1;
    background:
      repeating-linear-gradient(0deg, rgba(18,33,31,0.03) 0 1px, transparent 1px 4px),
      var(--paper);
    margin:0 16px; border:3px solid var(--ink);
    box-shadow:5px 5px 0 rgba(0,0,0,0.35); position:relative;
  }
  .screen-inner{ padding:28px 32px 36px; }
  @media (max-width:600px){ .screen-inner{ padding:16px 12px 20px; } #screen{margin:0 8px;} }

  .level-tag{
    display:inline-block; font-size:0.6rem; color:var(--paper);
    background:var(--river-mid); padding:5px 8px; margin-bottom:12px; border:2px solid var(--ink);
  }
  h2.title{ font-family:'Press Start 2P', monospace; font-size:1.1rem; line-height:1.6; color:var(--river-deep); }
  .subtitle{ margin-top:12px; font-size:1.25rem; line-height:1.4; color:#2c3a38; }

  .btn{
    border:3px solid var(--ink); padding:12px 18px; font-size:0.68rem;
    background:var(--river-deep); color:var(--sand); box-shadow:3px 3px 0 rgba(0,0,0,0.4);
  }
  .btn:hover{ background:var(--river-mid); }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.4); }

  .actions-row{ margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; }

  /* Canvas y Controles */
  .game-hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; font-size:0.6rem; font-family:'Press Start 2P'; color:var(--river-deep);
  }
  .canvas-wrap{ margin-top:8px; border:3px solid var(--ink); line-height:0; position:relative; }
  #mg-canvas{ display:block; width:100%; background:#DFF3EC; }

  .dpad-container{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:14px; gap:4px; }
  .dpad-row{ display:flex; gap:4px; }
  .dpad-btn{
    width:50px; height:50px; font-size:1rem; background:var(--river-mid); color:var(--sand);
    border:3px solid var(--ink); box-shadow:2px 2px 0 rgba(0,0,0,0.3);
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .dpad-btn:active, .dpad-btn.active{ background:var(--gold); color:var(--ink); transform:translate(1px,1px); box-shadow:none; }
  .controls-hint{ text-align:center; font-size:0.85rem; color:#555; margin-top:6px; }

  /* Modal Tienda */
  #shop-modal{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(15,61,62,0.85); backdrop-filter:blur(2px);
    align-items:center; justify-content:center; padding:16px;
  }
  #shop-modal.open{ display:flex; }
  .shop-card{
    background:var(--paper); border:4px solid var(--ink);
    max-width:540px; width:100%; padding:22px; box-shadow:8px 8px 0 rgba(0,0,0,0.5);
  }
  .shop-title{ font-size:0.9rem; color:var(--river-deep); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .shop-grid{ display:flex; flex-direction:column; gap:10px; margin-top:14px; max-height:60vh; overflow-y:auto; }
  .shop-item{
    border:2px solid var(--ink); background:#fff; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .shop-item-info h4{ margin:0; font-family:'Press Start 2P'; font-size:0.65rem; color:var(--river-deep); }
  .shop-item-info p{ margin:4px 0 0; font-size:1rem; color:#444; }
  .buy-btn{
    border:2px solid var(--ink); background:var(--gold); color:var(--ink);
    padding:8px 10px; font-size:0.6rem; font-weight:bold; white-space:nowrap;
  }
  .buy-btn:disabled{ opacity:0.4; cursor:not-allowed; background:#ccc; }

  /* Popup de Tip del Río (aviso pequeño centrado) */
  #tip-modal{
    display:none; position:fixed; inset:0; z-index:110;
    background:rgba(15,61,62,0.55); align-items:center; justify-content:center; padding:16px;
  }
  #tip-modal.open{ display:flex; }
  .tip-modal-card{
    background:var(--paper); border:4px solid var(--ink); max-width:320px; width:100%;
    padding:20px; box-shadow:6px 6px 0 rgba(0,0,0,0.45); text-align:center;
  }
  .tip-modal-head{
    font-family:'Press Start 2P', monospace; font-size:0.62rem; line-height:1.5;
    color:var(--river-deep); margin-bottom:10px;
  }
  .tip-modal-head.warn{ color:var(--danger); }
  .tip-modal-text{ font-size:1.15rem; line-height:1.4; color:var(--ink); margin:0 0 16px; }
  .tip-modal-card .btn{ width:100%; }
  .gameover-card{
    background:linear-gradient(180deg,#F9F3E6,#E8DCC2); border:4px solid var(--ink);
    max-width:390px; width:100%; padding:24px; box-shadow:8px 8px 0 rgba(0,0,0,0.5);
    text-align:center; position:relative; overflow:hidden;
  }
  .gameover-icon{ font-size:2.6rem; margin-bottom:8px; }
  .gameover-title{ font-family:'Press Start 2P'; font-size:.9rem; line-height:1.6; color:var(--danger); margin:0 0 10px; }
  .gameover-text{ font-size:1.2rem; line-height:1.4; margin:0 0 16px; color:var(--ink); }
  .gameover-stats{ display:flex; justify-content:center; gap:16px; margin:0 0 18px; font-family:'Press Start 2P'; font-size:.55rem; color:var(--river-deep); }
  #gameover-modal{
    display:none; position:fixed; inset:0; z-index:120; background:rgba(8,35,36,.72);
    backdrop-filter:blur(3px); align-items:center; justify-content:center; padding:16px;
  }
  #gameover-modal.open{ display:flex; }
  #profile-modal{display:none;position:fixed;inset:0;z-index:130;background:rgba(8,35,36,.78);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:16px;}
  #profile-modal.open{display:flex;}
  .profile-card{background:linear-gradient(180deg,#F9F3E6,#E8DCC2);border:4px solid var(--ink);max-width:430px;width:100%;padding:24px;box-shadow:8px 8px 0 rgba(0,0,0,.5);text-align:center;}
  .profile-title{font-family:'Press Start 2P';font-size:.85rem;line-height:1.6;color:var(--river-deep);margin-bottom:10px;}
  .profile-text{font-size:1.18rem;line-height:1.4;color:var(--ink);margin:0 0 14px;}
  .profile-input{width:100%;box-sizing:border-box;border:3px solid var(--ink);background:#fff;padding:12px;font-family:'VT323',monospace;font-size:1.35rem;color:var(--ink);margin-bottom:10px;outline:none;}
  .saved-profiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 14px;}
  .saved-profile-btn{border:2px solid var(--ink);background:#D9E9DF;color:var(--ink);padding:7px 10px;font-family:'VT323',monospace;font-size:1rem;cursor:pointer;}
  footer{ text-align:center; color:rgba(247,242,231,0.6); font-size:0.7rem; padding:14px 10px 0; }
</style>
</head>
<body>
<div id="bg-waves"></div>
<div id="app">

  <div id="hud">
    <div class="brand">
      <span class="mark"></span>
      <span id="brand-title">The Cauca Guardians</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="coin-ic"></span><span id="coin-count">0</span></div>
      <div class="healthbar-wrap">
        <div class="healthbar"><i id="health-fill" style="width:70%"></i></div>
        <span id="health-num" style="font-size:0.9rem;">70</span>
      </div>
      <button class="hud-btn shop-btn" id="open-shop">🛒 TIENDA</button>
      <button class="hud-btn" id="sound-toggle">🎵 MUSIC: ON</button>
      <button class="hud-btn" id="lang-toggle">EN</button>
    </div>
  </div>

  <div id="active-skills-bar"></div>
  <div class="wave-pixel"></div>

  <div id="screen"><div class="screen-inner" id="screen-inner"></div></div>

  <!-- ECO-SHOP MODAL -->
  <div id="shop-modal">
    <div class="shop-card">
      <div class="shop-title">
        <span>🛒 ECO-SHOP DE HABILIDADES</span>
        <button class="hud-btn" id="close-shop" style="background:var(--danger);color:#fff;">✕</button>
      </div>
      <p style="margin:0;font-size:1.1rem;color:#333;">Invierte tus <strong>Cauca Coins</strong> para proteger el río Cauca:</p>
      <div class="shop-grid" id="shop-items-container"></div>
    </div>
  </div>

  <!-- POPUP DE TIP DEL RÍO -->
  <div id="tip-modal">
    <div class="tip-modal-card">
      <div class="tip-modal-head" id="tip-modal-head"></div>
      <p class="tip-modal-text" id="tip-modal-text"></p>
      <button class="btn" id="tip-modal-next"></button>
    </div>
  </div>
  <div id="profile-modal">
    <div class="profile-card">
      <div class="gameover-icon">🌊🛡️</div>
      <div class="profile-title">¡HOLA, FUTURO GUARDIA!</div>
      <p class="profile-text">¿Cuál es tu nombre, futuro guardia del Río Cauca?</p>
      <input id="profile-name" class="profile-input" maxlength="18" autocomplete="off" placeholder="Escribe tu nombre">
      <div id="saved-profiles" class="saved-profiles"></div>
      <button class="btn" id="profile-start">Entrar al Río Cauca</button>
    </div>
  </div>
  <div id="gameover-modal">
    <div class="gameover-card">
      <div class="gameover-icon">🌊⚠️</div>
      <h2 class="gameover-title" id="gameover-title">¡NIVEL NO SUPERADO!</h2>
      <p class="gameover-text" id="gameover-text"></p>
      <div class="gameover-stats"><span id="gameover-score">0 / 0</span><span id="gameover-health">❤ 0</span></div>
      <button class="btn" id="gameover-retry">Intentar de nuevo</button>
    </div>
  </div>

  <footer id="footer-note">Caucasia · Bajo Cauca · Antioquia — Proyecto educativo bilingüe</footer>
</div>

<script>
(function(){
  "use strict";

  var LANG = 'es';
  function t(o){ return (typeof o === 'string') ? o : o[LANG]; }

  var soundEnabled = true;
  var audioCtx = null;
  var musicTimer = null;

  function initAudio(){
    if(!audioCtx){
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if(AudioContext) audioCtx = new AudioContext();
    }
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  // SINTETIZADOR CORREGIDO (Transición lineal fluida para notas continuas)
  function playTone(freq, duration, type, vol){
    if(!soundEnabled) return;
    initAudio();
    if(!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var now = audioCtx.currentTime;
      
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, now);
      
      gain.gain.setValueAtTime(vol || 0.1, now);
      gain.gain.linearRampToValueAtTime(0.001, now + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(now);
      osc.stop(now + duration);
    } catch(e){}
  }

  function play8BitDrum(){
    if(!soundEnabled) return;
    initAudio();
    if(!audioCtx) return;
    try {
      var bufferSize = audioCtx.sampleRate * 0.04;
      var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for(var i = 0; i < bufferSize; i++){ data[i] = Math.random() * 2 - 1; }
      var noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      var gain = audioCtx.createGain();
      var now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    } catch(e){}
  }

  // EFECTOS DE SONIDO (SFX)
  function playSfxGood(){ playTone(587.33, 0.08, 'square', 0.15); setTimeout(function(){ playTone(880, 0.12, 'square', 0.15); }, 70); }
  function playSfxBad(){ playTone(160, 0.1, 'sawtooth', 0.18); setTimeout(function(){ playTone(110, 0.18, 'sawtooth', 0.18); }, 80); }
  function playSfxLevelUp(){
    var notes = [261.63, 329.63, 392.00, 523.25, 659.25];
    notes.forEach(function(n, i){ setTimeout(function(){ playTone(n, 0.12, 'triangle', 0.2); }, i * 65); });
  }
  function playSfxBuy(){ playTone(440, 0.06, 'square', 0.15); setTimeout(function(){ playTone(880, 0.15, 'square', 0.15); }, 50); }

  // REPRODUCTOR BGM CHIPTUNE (Volúmenes ajustados y loop robusto)
  var leadMelody = [
    {f: 329.63, d: 0.18}, {f: 392.00, d: 0.18}, {f: 440.00, d: 0.18}, {f: 523.25, d: 0.18},
    {f: 440.00, d: 0.18}, {f: 392.00, d: 0.18}, {f: 329.63, d: 0.35},
    {f: 293.66, d: 0.18}, {f: 329.63, d: 0.18}, {f: 392.00, d: 0.18}, {f: 440.00, d: 0.18},
    {f: 392.00, d: 0.18}, {f: 329.63, d: 0.18}, {f: 293.66, d: 0.35}
  ];
  var bassMelody = [
    {f: 130.81, d: 0.35}, {f: 164.81, d: 0.35}, {f: 146.83, d: 0.35}, {f: 130.81, d: 0.35}
  ];

  var noteStep = 0, bassStep = 0;

  function startMusic(){
    initAudio();
    if(musicTimer) clearInterval(musicTimer);

    musicTimer = setInterval(function(){
      if(!soundEnabled) return;
      initAudio();

      // Melodía Principal (Square Wave)
      var note = leadMelody[noteStep];
      playTone(note.f, note.d, 'square', 0.12);
      noteStep = (noteStep + 1) % leadMelody.length;

      // Línea de Bajo (Triangle Wave)
      if(noteStep % 2 === 0){
        var bNote = bassMelody[bassStep];
        playTone(bNote.f, bNote.d, 'triangle', 0.15);
        bassStep = (bassStep + 1) % bassMelody.length;
      }

      // Percusión Sintética (Snare Noise)
      if(noteStep % 4 === 2){
        play8BitDrum();
      }

    }, 200);
  }

  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  }

  // CONTROLES DE TECLADO
  var keys = { up: false, down: false, left: false, right: false };
  window.addEventListener('keydown', function(e){
    if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
  });

  // PERFILES PERSISTENTES: cada nombre tiene sus propias monedas y habilidades.
  var PROFILE_KEY='caucaGuardiansProfiles', profileName='';
  function normalizeProfileName(name){return String(name||'').trim().replace(/\s+/g,' ').slice(0,18);}
  function profileId(name){return normalizeProfileName(name).toLowerCase();}
  function loadProfiles(){
    try{var raw=localStorage.getItem(PROFILE_KEY);if(raw){var d=JSON.parse(raw);if(d&&d.profiles)return d.profiles;}}catch(e){}
    return {};
  }
  function defaultProfile(){return {coins:30,skills:{shield:0,magnet:false,voice:false,filter:0}};}
  function loadProfile(name){
    var p=loadProfiles()[profileId(name)];
    if(!p)return defaultProfile();
    return {coins:typeof p.coins==='number'?p.coins:30,skills:{
      shield:p.skills&&typeof p.skills.shield==='number'?p.skills.shield:0,
      magnet:!!(p.skills&&p.skills.magnet),voice:!!(p.skills&&p.skills.voice),
      filter:p.skills&&typeof p.skills.filter==='number'?p.skills.filter:0}};
  }
  function saveProfile(){
    if(!profileName)return;
    try{var profiles=loadProfiles();profiles[profileId(profileName)]={name:profileName,coins:state.coins,skills:state.skills};localStorage.setItem(PROFILE_KEY,JSON.stringify({profiles:profiles}));}catch(e){}
  }
  function renderSavedProfiles(){
    var box=document.getElementById('saved-profiles');if(!box)return;
    var ps=loadProfiles(),names=Object.keys(ps).map(function(id){return ps[id].name||id;});
    if(!names.length){box.innerHTML='';return;}
    box.innerHTML='<div style="width:100%;font-size:.95rem;margin-bottom:4px;color:#345;">Perfiles guardados:</div>'+
      names.map(function(n){return '<button type="button" class="saved-profile-btn" data-name="'+String(n).replace(/"/g,'&quot;')+'">👤 '+String(n).replace(/</g,'&lt;')+'</button>';}).join('');
    box.querySelectorAll('.saved-profile-btn').forEach(function(btn){btn.onclick=function(){document.getElementById('profile-name').value=btn.getAttribute('data-name');startProfile(btn.getAttribute('data-name'));};});
  }
  var profile=defaultProfile();
  var state={coins:profile.coins,health:70,levelIndex:0,phase:'intro',skills:profile.skills,levelStats:{collected:0,goal:0,hits:0,gameOk:false}};
  function resetLevelStats(){state.levelStats={collected:0,goal:0,hits:0,gameOk:false};}
  function startProfile(name){
    name=normalizeProfileName(name);if(!name)return;
    profileName=name;profile=loadProfile(name);state.coins=profile.coins;state.skills=profile.skills;
    state.health=70;state.levelIndex=0;state.phase='intro';resetLevelStats();saveProfile();updateHud();render();
    document.getElementById('profile-modal').classList.remove('open');
  }

  var SKILLS_DEF = [
    {
      id: 'shield', name: {es:'🛡️ Escudo Anti-Mercurio', en:'🛡️ Mercury Shield'},
      desc: {es:'Protege contra 3 impactos de mercurio/basura.', en:'Protects against 3 hazard hits.'}, cost: 20,
      buy: function(){ state.skills.shield += 3; }
    },
    {
      id: 'magnet', name: {es:'🧲 Imán Ecológico', en:'🧲 Eco-Magnet'},
      desc: {es:'Atrae gotas y peces hacia ti en el minijuego.', en:'Attracts clean items toward you.'}, cost: 25,
      buy: function(){ state.skills.magnet = true; }
    },
    {

  function roundRectPath(ctx, x, y, w, h, rad){
    ctx.beginPath();
    ctx.moveTo(x+rad, y);
    ctx.arcTo(x+w, y, x+w, y+h, rad);
    ctx.arcTo(x+w, y+h, x, y+h, rad);
    ctx.arcTo(x, y+h, x, y, rad);
    ctx.arcTo(x, y, x+w, y, rad);
    ctx.closePath();
  }

  // Ajusta el brillo de un color hex (percent > 0 aclara, < 0 oscurece)
  function shade(hex, percent){
    hex = hex.replace('#','');
    if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var num = parseInt(hex, 16);
    var r = Math.max(0, Math.min(255, (num >> 16) + percent));
    var g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + percent));
    var b = Math.max(0, Math.min(255, (num & 0xff) + percent));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function volumeFill(ctx, x, y, r, color){
    var g = ctx.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r*1.15);
    g.addColorStop(0, shade(color, 55));
    g.addColorStop(0.55, color);
    g.addColorStop(1, shade(color, -35));
    return g;
  }

  function teardropPath(x, y, r){
    var p = new Path2D();
    p.moveTo(x, y - r*1.1);
    p.bezierCurveTo(x + r*0.9, y - r*0.15, x + r*0.75, y + r*0.9, x, y + r*0.9);
    p.bezierCurveTo(x - r*0.75, y + r*0.9, x - r*0.9, y - r*0.15, x, y - r*1.1);
    p.closePath();
    return p;
  }

  function drawDrop(ctx, x, y, r, color){
    var path = teardropPath(x, y, r);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = r*0.5; ctx.shadowOffsetY = r*0.12;
    ctx.fillStyle = volumeFill(ctx, x, y, r, color);
    ctx.fill(path);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = shade(color, -55); ctx.lineWidth = Math.max(1, r*0.09);
    ctx.stroke(path);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(x - r*0.22, y - r*0.05, r*0.16, r*0.26, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Basura flotante: tres sprites reconocibles (botella, lata y bolsa/empaque).
  // La variante se calcula con la posición para que no haga falta guardar estado extra.
  function drawTrash(ctx, x, y, r, color){
    var palette = Array.isArray(color) ? color : [color];
    var seed = Math.abs(Math.sin(x*12.9898 + y*78.233));
    var variant = Math.floor(seed * 3);
    var accent = palette[variant % palette.length];
    var outline = '#173B3B';

    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = 'rgba(0,0,0,0.38)';
    ctx.shadowBlur = r*0.42;
    ctx.shadowOffsetY = r*0.14;

    if(variant === 0){
      // BOTELLA
      var w = r*0.72, h = r*1.55;
      var body = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
      body.addColorStop(0, '#F7F5EA');
      body.addColorStop(0.55, '#D9DDD7');
      body.addColorStop(1, '#9EA9A4');
      ctx.fillStyle = body;
      roundRectPath(ctx, -w/2, -h/2+r*0.16, w, h*0.68, r*0.13); ctx.fill();
      ctx.fillStyle = '#DDE3DE';
      roundRectPath(ctx, -w*0.23, -h/2-r*0.03, w*0.46, h*0.32, r*0.07); ctx.fill();
      ctx.fillStyle = '#E4B83E';
      roundRectPath(ctx, -w*0.27, -h/2-r*0.13, w*0.54, h*0.13, r*0.04); ctx.fill();
      ctx.fillStyle = accent;
      roundRectPath(ctx, -w*0.45, -h*0.02, w*0.9, h*0.23, r*0.04); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      roundRectPath(ctx, -w*0.25, -h*0.24, w*0.11, h*0.42, r*0.04); ctx.fill();
      ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r*0.07);
      roundRectPath(ctx, -w/2, -h/2+r*0.16, w, h*0.68, r*0.13); ctx.stroke();
      roundRectPath(ctx, -w*0.23, -h/2-r*0.03, w*0.46, h*0.32, r*0.07); ctx.stroke();
    } else if(variant === 1){
      // LATA
      var cw = r*1.05, ch = r*1.30;
      var can = ctx.createLinearGradient(-cw/2, 0, cw/2, 0);
      can.addColorStop(0, '#6D7B79');
      can.addColorStop(0.22, '#D6DDDA');
      can.addColorStop(0.55, '#F0F2EC');
      can.addColorStop(1, '#71807D');
      ctx.fillStyle = can;
      roundRectPath(ctx, -cw/2, -ch/2, cw, ch, r*0.17); ctx.fill();
      ctx.fillStyle = accent;
      roundRectPath(ctx, -cw*0.46, -ch*0.06, cw*0.92, ch*0.28, r*0.04); ctx.fill();
      ctx.fillStyle = '#BBC5C1';
      ctx.beginPath(); ctx.ellipse(0, -ch/2, cw*0.46, r*0.13, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#566260'; ctx.lineWidth = Math.max(1, r*0.045); ctx.stroke();
      ctx.fillStyle = '#697572';
      ctx.beginPath(); ctx.ellipse(0, -ch/2, cw*0.14, r*0.055, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.68)';
      roundRectPath(ctx, -cw*0.28, -ch*0.28, cw*0.10, ch*0.36, r*0.03); ctx.fill();
      ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r*0.07);
      roundRectPath(ctx, -cw/2, -ch/2, cw, ch, r*0.17); ctx.stroke();
    } else {
      // BOLSA / EMPAQUE
      var bw = r*1.45, bh = r*1.05;
      var pts = [
        [-bw*0.52,-bh*0.35],[-bw*0.20,-bh*0.52],[0,-bh*0.38],[bw*0.22,-bh*0.5],
        [bw*0.53,-bh*0.28],[bw*0.42,bh*0.42],[bw*0.05,bh*0.53],[-bw*0.32,bh*0.42],[-bw*0.56,bh*0.18]
      ];
      ctx.fillStyle = '#F2D34F';
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.moveTo(-bw*0.36,-bh*0.08); ctx.lineTo(bw*0.34,-bh*0.20); ctx.lineTo(bw*0.28,bh*0.10); ctx.lineTo(-bw*0.30,bh*0.22); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(80,70,35,0.55)'; ctx.lineWidth = Math.max(1, r*0.045);
      ctx.beginPath(); ctx.moveTo(-bw*0.26,-bh*0.31); ctx.lineTo(-bw*0.10,bh*0.30);
      ctx.moveTo(bw*0.05,-bh*0.32); ctx.lineTo(bw*0.18,bh*0.34); ctx.stroke();
      ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r*0.07);
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(var j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]);
      ctx.closePath(); ctx.stroke();
    }

    // Brillo común: ayuda a que el objeto se lea sobre el agua.
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-r*0.62, -r*0.70, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawFish(ctx, x, y, r, color){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = r*0.45; ctx.shadowOffsetY = r*0.1;
    ctx.fillStyle = volumeFill(ctx, x, y, r, color);
    ctx.beginPath(); ctx.ellipse(x - r*0.12, y, r*0.85, r*0.52, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + r*0.62, y); ctx.lineTo(x + r*1.15, y - r*0.42); ctx.lineTo(x + r*1.15, y + r*0.42);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = shade(color, -50); ctx.lineWidth = Math.max(1, r*0.07);
    ctx.beginPath(); ctx.ellipse(x - r*0.12, y, r*0.85, r*0.52, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(x - r*0.3, y - r*0.18, r*0.22, r*0.12, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#12211F';
    ctx.beginPath(); ctx.arc(x - r*0.55, y - r*0.1, r*0.11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - r*0.58, y - r*0.13, r*0.04, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawDrum(ctx, x, y, r, color){
    var w = r*1.5, h = r*1.85;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = r*0.5; ctx.shadowOffsetY = r*0.15;
    var g = ctx.createLinearGradient(x-w/2, 0, x+w/2, 0);
    g.addColorStop(0, shade(color,-25)); g.addColorStop(0.5, shade(color,30)); g.addColorStop(1, shade(color,-25));
    ctx.fillStyle = g;
    roundRectPath(ctx, x-w/2, y-h/2, w, h, r*0.28); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = shade(color,-55); ctx.lineWidth = Math.max(1, r*0.08);
    roundRectPath(ctx, x-w/2, y-h/2, w, h, r*0.28); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x-w/2, y-h*0.16, w, h*0.1);
    ctx.fillRect(x-w/2, y+h*0.06, w, h*0.1);
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath(); ctx.arc(x, y-h*0.28, r*0.32, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = Math.max(1, r*0.04); ctx.stroke();
    ctx.fillStyle = '#12211F';
    ctx.font = 'bold ' + Math.round(r*0.85) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', x, y-h*0.28);
    ctx.restore();
  }

  function drawNet(ctx, x, y, r, color){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = r*0.3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, r*0.14);
    for(var i=-2; i<=2; i++){
      ctx.beginPath(); ctx.moveTo(x-r, y+i*r*0.5); ctx.lineTo(x+r, y+i*r*0.5+r*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-r, y+i*r*0.5+r*0.7); ctx.lineTo(x+r, y+i*r*0.5); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = shade(color, -30); ctx.lineWidth = Math.max(1, r*0.12);
    ctx.beginPath(); ctx.arc(x, y, r*0.95, 0, Math.PI*2); ctx.stroke();
  }

  // Residuo contaminante flotante: una capa de espuma y aceite, no una simple mancha.
  // Se compone de pequeños flotadores para que parezca algo que realmente permanece sobre el agua.
  function drawSludge(ctx, x, y, r, color){
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.32)'; ctx.shadowBlur=r*0.32; ctx.shadowOffsetY=r*0.12;

    // Película de aceite: elipse irregular y transparente.
    var oil=ctx.createRadialGradient(x-r*.2,y-r*.18,r*.08,x,y,r*1.1);
    oil.addColorStop(0,'rgba(176,194,93,0.72)');
    oil.addColorStop(.45,'rgba(104,123,58,0.62)');
    oil.addColorStop(1,'rgba(45,58,33,0.38)');
    ctx.fillStyle=oil;
    ctx.beginPath();
    ctx.ellipse(x,y+r*.12,r*1.15,r*.48,-.08,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    // Aros de la película aceitosa.
    ctx.strokeStyle='rgba(225,202,91,.72)'; ctx.lineWidth=Math.max(1,r*.06);
    ctx.beginPath(); ctx.ellipse(x-r*.08,y,r*.78,r*.28,-.12,Math.PI*1.08,Math.PI*1.85); ctx.stroke();
    ctx.strokeStyle='rgba(115,177,154,.62)';
    ctx.beginPath(); ctx.ellipse(x+r*.12,y+r*.02,r*.92,r*.34,.05,-.25,.85); ctx.stroke();

    // Espuma tóxica: varios grumos blancos/verdosos, mucho más reconocibles que una mancha.
    var foam=[
      [-.78,-.10,.30],[-.48,-.28,.23],[-.18,-.08,.34],[.16,-.25,.27],[.48,-.08,.31],[.76,-.02,.22],
      [-.58,.20,.18],[-.22,.25,.21],[.25,.20,.19],[.58,.22,.17]
    ];
    foam.forEach(function(f,i){
      var fx=x+r*f[0], fy=y+r*f[1], fr=r*f[2];
      var fg=ctx.createRadialGradient(fx-fr*.25,fy-fr*.3,fr*.05,fx,fy,fr);
      fg.addColorStop(0,'#D8DEB0'); fg.addColorStop(.55,'#A9B67A'); fg.addColorStop(1,'#697844');
      ctx.fillStyle=fg;
      ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(39,52,30,.65)'; ctx.lineWidth=Math.max(1,r*.035); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.62)';
      ctx.beginPath(); ctx.arc(fx-fr*.28,fy-fr*.30,fr*.18,0,Math.PI*2); ctx.fill();
    });

    // Pequeños residuos visibles dentro de la espuma.
    ctx.fillStyle='#4B3D2A';
    ctx.save(); ctx.rotate(-.2);
    roundRectPath(ctx,x-r*.18,y-r*.05,r*.30,r*.08,r*.03); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#5A4A2F';
    ctx.beginPath(); ctx.arc(x+r*.52,y+r*.05,r*.055,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  var ICON_DRAW = { drop: drawDrop, trash: drawTrash, fish: drawFish, drum: drawDrum, net: drawNet, sludge: drawSludge };

  function drawPlayer(ctx, x, y, r){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y+r*0.95, r*0.75, r*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = r*0.3; ctx.shadowOffsetY = r*0.08;
    var bodyGrad = ctx.createRadialGradient(x - r*0.2, y - r*0.1, r*0.1, x, y + r*0.18, r*0.95);
    bodyGrad.addColorStop(0, '#1F7A76'); bodyGrad.addColorStop(1, '#0F3D3E');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.arc(x, y + r*0.18, r*0.85, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#C9A227'; ctx.lineWidth = r*0.16;
    ctx.beginPath(); ctx.arc(x, y + r*0.18, r*0.85, Math.PI*0.12, Math.PI*0.88); ctx.stroke();

    var faceGrad = ctx.createRadialGradient(x - r*0.15, y - r*0.45, r*0.1, x, y - r*0.32, r*0.65);
    faceGrad.addColorStop(0, '#FBE0BE'); faceGrad.addColorStop(1, '#E8B888');
    ctx.fillStyle = faceGrad;
    ctx.beginPath(); ctx.arc(x, y - r*0.32, r*0.6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = Math.max(1, r*0.04); ctx.stroke();

    var hatGrad = ctx.createLinearGradient(x, y - r*1.3, x, y - r*0.5);
    hatGrad.addColorStop(0, '#6BBE86'); hatGrad.addColorStop(1, '#3D7E52');
    ctx.fillStyle = hatGrad;
    ctx.beginPath();
    ctx.moveTo(x - r*0.68, y - r*0.5);
    ctx.quadraticCurveTo(x, y - r*1.3, x + r*0.68, y - r*0.5);
    ctx.quadraticCurveTo(x, y - r*0.68, x - r*0.68, y - r*0.5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = Math.max(1, r*0.05); ctx.stroke();

    ctx.fillStyle = '#12211F';
    ctx.beginPath(); ctx.arc(x - r*0.22, y - r*0.32, r*0.075, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.22, y - r*0.32, r*0.075, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x - r*0.19, y - r*0.35, r*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.25, y - r*0.35, r*0.025, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // FONDO ANIMADO DEL RÍO (para que el jugador recoja las cosas directo del agua)
  function drawRiverBackground(ctx, W, H, cfg, tSec){
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, shade(cfg.bgFrom, 20));
    grad.addColorStop(0.5, cfg.bgFrom);
    grad.addColorStop(1, '#0B2E2F');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    // Profundidad del agua: franjas suaves que siguen el movimiento del río.
    ctx.save();
    ctx.globalAlpha=.10;
    for(var depth=0; depth<5; depth++){
      ctx.strokeStyle = depth%2 ? '#D8F3E9' : '#071F20';
      ctx.lineWidth=1;
      ctx.beginPath();
      for(var wx=0; wx<=W; wx+=5){
        var wy=H*(.20+depth*.14)+Math.sin(wx*.045+tSec*1.3+depth)*2.2;
        if(wx===0) ctx.moveTo(wx,wy); else ctx.lineTo(wx,wy);
      }
      ctx.stroke();
    }
    ctx.restore();

    var bankH = Math.max(3, Math.round(H*0.09));
    var bankGradTop = ctx.createLinearGradient(0,0,0,bankH);
    bankGradTop.addColorStop(0, '#F5EEDD'); bankGradTop.addColorStop(1, '#DCCFAE');
    ctx.fillStyle = bankGradTop; ctx.fillRect(0,0,W,bankH);
    var bankGradBottom = ctx.createLinearGradient(0,H-bankH,0,H);
    bankGradBottom.addColorStop(0, '#DCCFAE'); bankGradBottom.addColorStop(1, '#C9B98C');
    ctx.fillStyle = bankGradBottom; ctx.fillRect(0,H-bankH,W,bankH);

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, bankH, W, 2);
    ctx.fillRect(0, H-bankH-2, W, 2);

    ctx.fillStyle = '#4C9A6A';
    for(var i=0; i<W; i+=6){
      ctx.fillRect(i, bankH-2, 3, 2);
      ctx.fillRect(i+2, H-bankH, 3, 2);
    }

    // Textura sutil del agua: pequeñas corrientes que aportan profundidad sin competir con los objetos.
    ctx.strokeStyle = 'rgba(112,210,204,0.16)';
    ctx.lineWidth = 1;
    for(var flow=0; flow<7; flow++){
      var fy = bankH + 9 + flow * ((H-bankH*2-18)/7);
      ctx.beginPath();
      for(var fx=0; fx<=W; fx+=7){
        var fyy = fy + Math.sin(fx*0.045 + tSec*0.9 + flow*1.7) * 1.7;
        if(fx===0) ctx.moveTo(fx,fyy); else ctx.lineTo(fx,fyy);
      }
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    for(var row = bankH+4; row < H-bankH; row += 7){
      ctx.beginPath();
      for(var xx=0; xx<=W; xx+=4){
        var yy = row + Math.sin(xx*0.15 + tSec*2 + row) * 1.4;
        if(xx===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    }
  }

  var miniGameAnim = null;
  var screenEl = document.getElementById('screen-inner');

  function render(){
    if(miniGameAnim){ cancelAnimationFrame(miniGameAnim); miniGameAnim = null; }
    if(state.levelIndex >= LEVELS.length){ renderEnding(); return; }
    var level = LEVELS[state.levelIndex];
    if(state.phase === 'intro') renderLevelIntro(level);
    else renderMiniGame(level);
  }

  function renderLevelIntro(level){
    screenEl.innerHTML =
      '<div class="hero">'+
        '<div class="level-tag">👤 '+(profileName || 'Futuro guardia')+'</div>'+
        '<div class="level-tag">'+t(level.name)+'</div>'+
        '<h2 class="title">'+t(level.intro)+'</h2>'+
        '<p class="subtitle">¡Hola, '+(profileName ? profileName.replace(/</g,'&lt;') : 'futuro guardia')+'! El Río Cauca cuenta contigo.</p>'+
        '<div class="actions-row"><button class="btn" id="start-level">'+t({es:'Comenzar nivel',en:'Start level'})+'</button></div>'+
      '</div>';
    document.getElementById('start-level').onclick=function(){startMusic();resetLevelStats();state.phase='game';render();};
  }

  function renderMiniGame(level){
    var cfg = level.game;
    screenEl.innerHTML =
      '<div class="level-tag">'+t(level.name)+'</div>'+
      '<h2 class="title" style="font-size:0.78rem;">'+t(cfg.instructions)+'</h2>'+
      '<div class="game-hud"><span id="mg-timer">16s</span><span id="mg-score">0 / '+cfg.goal+'</span></div>'+
      '<div class="canvas-wrap"><canvas id="mg-canvas"></canvas></div>'+
      '<div class="dpad-container">'+
        '<button class="dpad-btn" id="dpad-up">▲</button>'+
        '<div class="dpad-row">'+
          '<button class="dpad-btn" id="dpad-left">◄</button>'+
          '<button class="dpad-btn" id="dpad-down">▼</button>'+
          '<button class="dpad-btn" id="dpad-right">►</button>'+
        '</div>'+
      '</div>'+
      '<div class="controls-hint">Teclado: <strong>WASD</strong> o <strong>Flechas</strong></div>';

    var canvas = document.getElementById('mg-canvas');
    var cssW = canvas.parentElement.clientWidth;
    var cssH = Math.round(cssW * 0.48);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW / 2);
    canvas.height = Math.round(cssH / 2);
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;

    var W = canvas.width, H = canvas.height;
    var scale = W / 300;
    var player = { x: W/2, y: H/2, r: 11*scale, speed: 95*scale };
    var itemR = (cfg.itemSize || 9)*scale;
    var items = [];
    var collected = 0, hits = 0, timeLeft = cfg.duration;

    function setupDpadBtn(id, keyName){
      var btn = document.getElementById(id); if(!btn) return;
      var start = function(e){ e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
      var end = function(e){ e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
      btn.addEventListener('touchstart', start, {passive:false});
      btn.addEventListener('touchend', end, {passive:false});
      btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', end); btn.addEventListener('mouseleave', end);
    }
    setupDpadBtn('dpad-up', 'up'); setupDpadBtn('dpad-down', 'down');
    setupDpadBtn('dpad-left', 'left'); setupDpadBtn('dpad-right', 'right');

    function spawn(type){ items.push({ x: Math.random()*(W-itemR*2)+itemR, y: Math.random()*(H-itemR*2)+itemR, r: itemR, type: type, phase: Math.random()*Math.PI*2, tilt: (Math.random()-.5)*0.18 }); }
    for(var i=0; i<cfg.goodCount; i++) spawn('good');
    for(var j=0; j<cfg.hazardCount; j++) spawn('bad');

    var lastTs = null;
    function loop(ts){
      if(!lastTs) lastTs = ts;
      var dt = (ts - lastTs) / 1000;
      lastTs = ts; timeLeft -= dt;

      if(keys.up) player.y -= player.speed * dt;
      if(keys.down) player.y += player.speed * dt;
      if(keys.left) player.x -= player.speed * dt;
      if(keys.right) player.x += player.speed * dt;

      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));

      if(state.skills.magnet){
        items.forEach(function(it){
          if(it.type === 'good'){
            var dx = player.x - it.x, dy = player.y - it.y;
            var dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 46*scale){ it.x += (dx/dist)*40*scale*dt; it.y += (dy/dist)*40*scale*dt; }
          }
        });
      }

      for(var k = items.length-1; k>=0; k--){
        var it = items[k];
        var dist = Math.sqrt((it.x-player.x)*(it.x-player.x) + (it.y-player.y)*(it.y-player.y));
        if(dist < it.r + player.r){
          if(it.type === 'good'){ collected++; addCoins(2); playSfxGood(); }
          else {
            hits++;
            if(state.skills.shield > 0){ state.skills.shield--; playSfxGood(); }
            else { applyHealth(-12); playSfxBad(); }
          }
          items.splice(k, 1); spawn(it.type);
        }
      }

      drawRiverBackground(ctx, W, H, cfg, ts/1000);
      items.forEach(function(it){
        var shape = (it.type==='good') ? cfg.goodShape : cfg.hazardShape;
        var color = it.type==='good' ? cfg.goodColor : cfg.hazardColor;
        var bob = Math.sin(ts/430 + it.phase) * it.r*0.10;
        ctx.save();
        if(it.type==='good'){
          ctx.strokeStyle='rgba(244,211,94,.20)';
          ctx.lineWidth=Math.max(1,it.r*.12);
          ctx.beginPath(); ctx.arc(it.x,it.y+bob,it.r*1.28,0,Math.PI*2); ctx.stroke();
        }
        ctx.translate(0,bob);
        if(shape==='trash') ctx.rotate(Math.sin(ts/700+it.phase)*it.tilt);
        (ICON_DRAW[shape] || ICON_DRAW.drop)(ctx, it.x, it.y, it.r, color);
        ctx.restore();
      });
      drawPlayer(ctx, player.x, player.y, player.r);

      document.getElementById('mg-timer').textContent = Math.ceil(timeLeft)+'s';
      document.getElementById('mg-score').textContent = collected+' / '+cfg.goal;

      if(state.health <= 0){
        state.levelStats.collected=collected; state.levelStats.goal=cfg.goal; state.levelStats.hits=hits;
        state.levelStats.gameOk=false;
        showGameOver(level,'health',collected,hits);
        return;
      }
      if(timeLeft <= 0){
        var reachedGoal = (collected >= cfg.goal);
        applyHealth(reachedGoal ? 10 : -5);
        state.levelStats.collected = collected;
        state.levelStats.goal = cfg.goal;
        state.levelStats.hits = hits;
        state.levelStats.gameOk = reachedGoal;
        if(!reachedGoal){ showGameOver(level,'time',collected,hits); return; }
        showLevelTip(level, true);
        return;
      }
      miniGameAnim = requestAnimationFrame(loop);
    }
    miniGameAnim = requestAnimationFrame(loop);
  }

  function showGameOver(level, reason, finalCollected, finalHits){
    if(miniGameAnim){ cancelAnimationFrame(miniGameAnim); miniGameAnim=null; }
    keys.up=keys.down=keys.left=keys.right=false;
    var modal=document.getElementById('gameover-modal');
    var title=document.getElementById('gameover-title');
    var text=document.getElementById('gameover-text');
    var score=document.getElementById('gameover-score');
    var health=document.getElementById('gameover-health');
    title.textContent = reason==='health' ? '¡EL RÍO COLAPSÓ!' : '¡NIVEL NO SUPERADO!';
    text.textContent = reason==='health'
      ? t({es:'Los impactos fueron demasiados y la salud del río llegó a 0.',en:'Too many impacts caused the river health to reach 0.'})
      : t({es:'Se acabó el tiempo y no reuniste suficiente basura. ¡Inténtalo otra vez!',en:'Time ran out before you collected enough trash. Try again!' });
    score.textContent = finalCollected+' / '+level.game.goal;
    health.textContent = '❤ '+state.health;
    modal.classList.add('open');
    document.getElementById('gameover-retry').onclick=function(){
      modal.classList.remove('open');
      state.health=70;
      resetLevelStats();
      state.phase='game';
      updateHud();
      render();
    };
  }

  function showLevelTip(level, wentWell){
    var tips = level.tips || {};
    var isLast = (state.levelIndex + 1 >= LEVELS.length);
    var headEl = document.getElementById('tip-modal-head');
    var textEl = document.getElementById('tip-modal-text');
    var nextBtn = document.getElementById('tip-modal-next');

    headEl.className = 'tip-modal-head' + (wentWell ? '' : ' warn');
    headEl.textContent = (wentWell ? '🌊 ' : '⚠️ ') + t({es:'TIP DEL RÍO', en:'RIVER TIP'});
    textEl.textContent = t(wentWell ? tips.good : tips.warn);
    nextBtn.textContent = isLast ? t({es:'Ver resultado final', en:'See final result'}) : t({es:'Siguiente nivel', en:'Next level'});

    document.getElementById('tip-modal').classList.add('open');
    nextBtn.onclick = function(){
      document.getElementById('tip-modal').classList.remove('open');
      playSfxLevelUp();
      state.levelIndex++; state.phase = 'intro';
      resetLevelStats(); render();
    };
  }

  function renderEnding(){
    screenEl.innerHTML =
      '<div class="level-tag">'+t({es:'Certificado de Guardián', en:'Guardian Certificate'})+'</div>'+
      '<h2 class="title">'+t({es:'¡Has completado el juego!', en:'Game Completed!'})+'</h2>'+
      '<p class="subtitle">'+t({es:'Salud final del Río Cauca: ', en:'Final River Health: '})+state.health+'/100</p>'+
      '<div class="actions-row"><button class="btn" id="restart">'+t({es:'Volver a jugar', en:'Play again'})+'</button></div>';
    document.getElementById('restart').onclick = function(){
      state.health = 70; state.levelIndex = 0; state.phase = 'intro';
      resetLevelStats(); updateHud(); render();
    };
  }

  // Pantalla inicial de guardia/perfil
  document.getElementById('profile-start').onclick = function(){
    startProfile(document.getElementById('profile-name').value);
  };
  document.getElementById('profile-name').addEventListener('keydown', function(e){
    if(e.key === 'Enter') startProfile(this.value);
  });
  renderSavedProfiles();
  document.getElementById('profile-modal').classList.add('open');

  // Desbloqueo global de audio con el primer clic/toque en la pantalla
  window.addEventListener('click', function(){ initAudio(); if(soundEnabled && !musicTimer) startMusic(); }, {once:true});
  window.addEventListener('touchstart', function(){ initAudio(); if(soundEnabled && !musicTimer) startMusic(); }, {once:true});

  updateHud(); render();
})();
</script>
