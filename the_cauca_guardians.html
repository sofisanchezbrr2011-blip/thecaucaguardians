<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cauca Guardians - Eco-Shop Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --river-deep:#0F3D3E;
    --river-mid:#155E5B;
    --gold:#C9A227;
    --gold-light:#E4C158;
    --danger:#B23A2E;
    --leaf:#4C9A6A;
    --sand:#EDE3D0;
    --sand-dim:#DED1B4;
    --ink:#12211F;
    --paper:#F7F2E7;
    --crystal:#7FD8D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'VT323', monospace;
    font-size:1.18rem;
    background:var(--river-deep);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display,#brand-title,.level-tag,.btn,#lang-toggle,.badge-chip,.q-count,.shop-btn{
    font-family:'Press Start 2P', monospace;
    font-weight:400;
    margin:0;
    line-height:1.5;
  }
  button{ font-family:inherit; cursor:pointer; }
  #bg-waves{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 4px),
      linear-gradient(180deg, var(--river-deep) 0%, var(--river-mid) 100%);
  }
  #app{
    position:relative; z-index:1;
    max-width:920px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding:0 0 40px 0;
  }

  .pixel-panel{
    border-radius:0;
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
  }

  /* HUD */
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    color:var(--sand);
    gap:10px;
    flex-wrap:wrap;
  }
  #hud .brand{ display:flex; align-items:center; gap:8px; }
  #hud .brand .mark{
    width:20px;height:20px;
    background:var(--gold);
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  }
  #hud .brand span{ font-size:0.7rem; }
  #hud .stats{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .stat{ display:flex; align-items:center; gap:6px; font-size:1.1rem; }
  .coin-ic{
    width:16px;height:16px;
    background: var(--gold);
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
    display:inline-block;
  }
  .healthbar-wrap{ display:flex; align-items:center; gap:6px; }
  .healthbar{
    width:110px; height:12px;
    background:rgba(247,242,231,0.2);
    border:2px solid var(--ink);
    overflow:hidden; position:relative;
  }
  .healthbar i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--danger), var(--gold) 50%, var(--leaf));
    transition:width .3s;
  }
  .hud-btn{
    background:rgba(247,242,231,0.15);
    border:2px solid rgba(247,242,231,0.5);
    color:var(--sand); padding:6px 10px; font-size:0.6rem;
  }
  .hud-btn:hover{ background:rgba(247,242,231,0.3); }
  .hud-btn.shop-btn{ background:var(--gold); color:var(--ink); border-color:var(--ink); font-weight:bold; }

  /* Active Skills Bar in HUD */
  #active-skills-bar{
    display:flex; gap:6px; padding:4px 20px 8px; justify-content:flex-end;
  }
  .skill-badge{
    background:var(--gold-light); border:1px solid var(--ink);
    color:var(--ink); font-size:0.8rem; padding:2px 6px;
    display:flex; align-items:center; gap:4px;
  }

  .wave-pixel{
    height:12px; width:100%;
    background-image:
      linear-gradient(-45deg, var(--paper) 6px, transparent 0),
      linear-gradient(45deg, var(--paper) 6px, transparent 0);
    background-position:0 0, 6px 0;
    background-size:12px 12px;
    background-repeat:repeat-x;
  }

  #screen{
    flex:1;
    background:
      repeating-linear-gradient(0deg, rgba(18,33,31,0.03) 0 1px, transparent 1px 4px),
      var(--paper);
    margin:0 16px; border:3px solid var(--ink);
    box-shadow:5px 5px 0 rgba(0,0,0,0.35); position:relative;
  }
  .screen-inner{ padding:28px 32px 36px; }
  @media (max-width:600px){ .screen-inner{ padding:20px 16px 24px; } #screen{margin:0 8px;} }

  .level-tag{
    display:inline-block; font-size:0.6rem; color:var(--paper);
    background:var(--river-mid); padding:5px 8px; margin-bottom:12px; border:2px solid var(--ink);
  }
  h2.title{ font-family:'Press Start 2P', monospace; font-size:1.1rem; line-height:1.6; color:var(--river-deep); }
  .subtitle{ margin-top:12px; font-size:1.25rem; line-height:1.4; color:#2c3a38; }

  .btn{
    border:3px solid var(--ink); padding:12px 18px; font-size:0.68rem;
    background:var(--river-deep); color:var(--sand);
    box-shadow:3px 3px 0 rgba(0,0,0,0.4);
  }
  .btn:hover{ background:var(--river-mid); }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.4); }
  .btn.secondary{ background:var(--paper); color:var(--river-deep); }

  .actions-row{ margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; }

  /* Questions & Options */
  .q-block{ margin-top:18px; }
  .q-count{ font-size:0.6rem; color:#6a7a76; margin-bottom:8px; display:block; }
  .q-prompt{ font-size:1.25rem; font-weight:600; color:var(--ink); margin-bottom:16px; }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left; border:2px solid var(--ink); background:#fff;
    padding:12px 14px; font-size:1.15rem; color:var(--ink);
  }
  .opt:hover:not(:disabled){ background:rgba(21,94,91,0.08); }
  .opt.correct{ border-color:var(--leaf); background:var(--leaf); color:#fff; }
  .opt.incorrect{ border-color:var(--danger); background:var(--danger); color:#fff; }

  .feedback{
    margin-top:14px; padding:12px 14px; font-size:1.1rem;
    background:rgba(21,94,91,0.08); border:2px solid var(--river-mid); border-left:5px solid var(--river-mid);
  }
  .feedback.bad{ background:rgba(178,58,46,0.09); border-color:var(--danger); }
  .feedback.delta{ font-weight:600; margin-top:6px; display:block; font-family:'Press Start 2P'; font-size:0.6rem; }

  .scenario-box{
    margin-top:14px; padding:14px; background:rgba(201,162,39,0.12);
    border:2px solid var(--gold); border-left:5px solid var(--gold); font-size:1.2rem;
  }

  .level-dots{ display:flex; gap:6px; margin-top:18px; }
  .level-dots i{ width:10px; height:10px; background:rgba(18,33,31,0.15); }
  .level-dots i.done{ background:var(--leaf); }
  .level-dots i.active{ background:var(--river-deep); }

  /* Canvas Game */
  .game-hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; font-size:0.6rem; font-family:'Press Start 2P'; color:var(--river-deep);
  }
  .canvas-wrap{ margin-top:8px; border:3px solid var(--ink); line-height:0; }
  #mg-canvas{ display:block; width:100%; touch-action:none; cursor:pointer; image-rendering:pixelated; }

  /* Modal Shop */
  #shop-modal{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(15,61,62,0.85); backdrop-filter:blur(2px);
    align-items:center; justify-content:center; padding:16px;
  }
  #shop-modal.open{ display:flex; }
  .shop-card{
    background:var(--paper); border:4px solid var(--ink);
    max-width:540px; width:100%; padding:22px;
    box-shadow:8px 8px 0 rgba(0,0,0,0.5);
  }
  .shop-title{ font-size:0.9rem; color:var(--river-deep); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .shop-grid{ display:flex; flex-direction:column; gap:10px; margin-top:14px; max-height:60vh; overflow-y:auto; }
  .shop-item{
    border:2px solid var(--ink); background:#fff; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .shop-item-info h4{ margin:0; font-family:'Press Start 2P'; font-size:0.65rem; color:var(--river-deep); }
  .shop-item-info p{ margin:4px 0 0; font-size:1rem; color:#444; }
  .buy-btn{
    border:2px solid var(--ink); background:var(--gold); color:var(--ink);
    padding:8px 10px; font-size:0.6rem; font-weight:bold; white-space:nowrap;
  }
  .buy-btn:disabled{ opacity:0.4; cursor:not-allowed; background:#ccc; }

  footer{ text-align:center; color:rgba(247,242,231,0.6); font-size:0.7rem; padding:14px 10px 0; }
</style>
</head>
<body>
<div id="bg-waves"></div>
<div id="app">

  <div id="hud">
    <div class="brand">
      <span class="mark"></span>
      <span id="brand-title">The Cauca Guardians</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="coin-ic"></span><span id="coin-count">0</span></div>
      <div class="healthbar-wrap">
        <div class="healthbar"><i id="health-fill" style="width:70%"></i></div>
        <span id="health-num" style="font-size:0.9rem;">70</span>
      </div>
      <button class="hud-btn shop-btn" id="open-shop">🛒 TIENDA</button>
      <button class="hud-btn" id="sound-toggle">🔊 ON</button>
      <button class="hud-btn" id="lang-toggle">EN</button>
    </div>
  </div>

  <div id="active-skills-bar"></div>
  <div class="wave-pixel"></div>

  <div id="screen"><div class="screen-inner" id="screen-inner"></div></div>

  <!-- ECO-SHOP MODAL -->
  <div id="shop-modal">
    <div class="shop-card">
      <div class="shop-title">
        <span>🛒 ECO-SHOP DE HABILIDADES</span>
        <button class="hud-btn" id="close-shop" style="background:var(--danger);color:#fff;">✕</button>
      </div>
      <p style="margin:0;font-size:1.1rem;color:#333;">Invierte tus <strong>Cauca Coins</strong> para desbloquear herramientas de protección ambiental:</p>
      <div class="shop-grid" id="shop-items-container"></div>
    </div>
  </div>

  <footer id="footer-note">Caucasia · Bajo Cauca · Antioquia — Proyecto educativo bilingüe</footer>
</div>

<script>
(function(){
  "use strict";

  var LANG = 'es';
  function t(o){ return (typeof o === 'string') ? o : o[LANG]; }

  var soundEnabled = true;
  var audioCtx = null;
  var bgOsc = null, bgGain = null, bgInterval = null;

  function initAudio(){
    if(!audioCtx){
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if(AudioContext) audioCtx = new AudioContext();
    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }

  function playTone(freq, duration, type, vol){
    if(!soundEnabled || !audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  function playSfxGood(){ playTone(587.33, 0.08, 'sine', 0.15); setTimeout(function(){ playTone(880, 0.12, 'square', 0.15); }, 80); }
  function playSfxBad(){ playTone(160, 0.1, 'sawtooth', 0.2); setTimeout(function(){ playTone(110, 0.18, 'sawtooth', 0.2); }, 90); }
  function playSfxLevelUp(){
    var notes = [261.63, 329.63, 392.00, 523.25, 659.25];
    notes.forEach(function(n, i){ setTimeout(function(){ playTone(n, 0.1, 'triangle', 0.2); }, i * 70); });
  }
  function playSfxBuy(){ playTone(440, 0.06, 'square', 0.2); setTimeout(function(){ playTone(880, 0.15, 'square', 0.2); }, 60); }

  function startMusic(){
    if(!soundEnabled || bgInterval) return;
    initAudio();
    if(!audioCtx) return;
    var melody = [261.63, 293.66, 329.63, 349.23, 392.00, 329.63, 261.63, 196.00];
    var noteIdx = 0;
    bgInterval = setInterval(function(){
      if(!soundEnabled) return;
      playTone(melody[noteIdx], 0.14, 'triangle', 0.03);
      noteIdx = (noteIdx + 1) % melody.length;
    }, 280);
  }

  function stopMusic(){
    if(bgInterval){ clearInterval(bgInterval); bgInterval = null; }
  }

  // GAME STATE & SKILLS
  var state = {
    coins: 30, // Monedas iniciales para explorar la tienda
    health: 70,
    badges: [],
    levelIndex: 0,
    phase: 'intro',
    stepIndex: 0,
    correctInLevel: 0,
    skills: {
      shield: 0,  // Cargas de escudo anti-mercurio
      magnet: false, // Imán ecológico activo
      voice: false,  // Voz comunitaria (+100% vida por buenas decisiones)
      filter: 0   // Veces comprado el purificador
    }
  };

  var SKILLS_DEF = [
    {
      id: 'shield',
      name: {es:'🛡️ Escudo Anti-Mercurio', en:'🛡️ Mercury Shield'},
      desc: {es:'Protege contra 3 impactos de mercurio/basura en el minijuego.', en:'Protects against 3 hazard hits in mini-game.'},
      cost: 20,
      buy: function(){ state.skills.shield += 3; }
    },
    {
      id: 'magnet',
      name: {es:'🧲 Imán Ecológico', en:'🧲 Eco-Magnet'},
      desc: {es:'Atrae ítems limpios y peces hacia ti en el minijuego.', en:'Attracts clean items and fish toward you.'},
      cost: 25,
      buy: function(){ state.skills.magnet = true; }
    },
    {
      id: 'voice',
      name: {es:'📢 Voz Comunitaria', en:'📢 Community Voice'},
      desc: {es:'Duplica la salud ganada por respuestas y decisiones correctas.', en:'Doubles river health gained from correct choices.'},
      cost: 30,
      buy: function(){ state.skills.voice = true; }
    },
    {
      id: 'filter',
      name: {es:'🌿 Purificador Bio-Remediador', en:'🌿 Bio-Filter'},
      desc: {es:'Restaura +20 de Salud del Río inmediatamente.', en:'Instantly restores +20 River Health.'},
      cost: 35,
      buy: function(){ applyHealth(20); state.skills.filter++; }
    }
  ];

  function clampHealth(){ state.health = Math.max(0, Math.min(100, state.health)); }
  function applyHealth(delta){
    if(delta > 0 && state.skills.voice){ delta *= 2; } // Multiplicador Voz Comunitaria
    state.health += delta;
    clampHealth();
    updateHud();
  }
  function addCoins(n){ state.coins += n; updateHud(); }

  function updateHud(){
    document.getElementById('coin-count').textContent = state.coins;
    document.getElementById('health-fill').style.width = state.health + '%';
    document.getElementById('health-num').textContent = state.health;
    document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    document.getElementById('lang-toggle').textContent = LANG === 'es' ? 'EN' : 'ES';

    // Dibujar insignias de habilidades activas
    var skillBar = document.getElementById('active-skills-bar');
    var html = '';
    if(state.skills.shield > 0) html += '<span class="skill-badge">🛡️ ' + state.skills.shield + '</span>';
    if(state.skills.magnet) html += '<span class="skill-badge">🧲 MAX</span>';
    if(state.skills.voice) html += '<span class="skill-badge">📢 2x</span>';
    skillBar.innerHTML = html;
  }

  // SHOP MODAL LOGIC
  function renderShop(){
    var container = document.getElementById('shop-items-container');
    var html = '';
    SKILLS_DEF.forEach(function(sk){
      var canBuy = state.coins >= sk.cost;
      var isOwnedPassive = (sk.id === 'magnet' && state.skills.magnet) || (sk.id === 'voice' && state.skills.voice);
      
      html += '<div class="shop-item">'+
        '<div class="shop-item-info">'+
          '<h4>'+t(sk.name)+'</h4>'+
          '<p>'+t(sk.desc)+'</p>'+
        '</div>'+
        '<button class="buy-btn" data-id="'+sk.id+'" '+(canBuy && !isOwnedPassive ? '' : 'disabled')+'>'+
          (isOwnedPassive ? t({es:'COMPRADO',en:'OWNED'}) : sk.cost + ' COINS')+
        '</button>'+
      '</div>';
    });
    container.innerHTML = html;

    container.querySelectorAll('.buy-btn').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-id');
        var sk = SKILLS_DEF.find(function(s){ return s.id === id; });
        if(sk && state.coins >= sk.cost){
          state.coins -= sk.cost;
          sk.buy();
          playSfxBuy();
          updateHud();
          renderShop();
        }
      };
    });
  }

  document.getElementById('open-shop').onclick = function(){
    renderShop();
    document.getElementById('shop-modal').classList.add('open');
  };
  document.getElementById('close-shop').onclick = function(){
    document.getElementById('shop-modal').classList.remove('open');
  };

  document.getElementById('sound-toggle').addEventListener('click', function(){
    soundEnabled = !soundEnabled;
    if(soundEnabled) startMusic(); else stopMusic();
    updateHud();
  });

  document.getElementById('lang-toggle').addEventListener('click', function(){
    LANG = (LANG === 'es') ? 'en' : 'es';
    updateHud();
    render();
  });

  // CONTENT DEFINITIONS
  var LEVELS = [
    {
      key:'l1',
      name:{es:'Nivel 1 · El Río Sano', en:'Level 1 · The Healthy River'},
      intro:{
        es:'Bienvenido(a) a Caucasia. Antes de enfrentar las amenazas del mercurio y la minería, debes entender el valor del agua limpia.',
        en:'Welcome to Caucasia. Before facing mercury and mining threats, understand the value of clean water.'
      },
      badge:{es:'Guardián del Agua', en:'Guardian of the Water'},
      type:'quiz',
      game:{
        instructions:{es:'Recoge gotas de agua limpia e ignora la basura.', en:'Collect clean water drops and dodge trash.'},
        goodColor:'#4C9A6A', hazardColor:'#8a7452',
        goodShape:'drop', hazardShape:'trash',
        goodCount:4, hazardCount:3, duration:16, goal:10, bgFrom:'#DFF3EC', bgTo:'#BFE3D6'
      },
      items:[
        {
          prompt:{es:'¿Por qué el río Cauca es vital para Caucasia y el Bajo Cauca?', en:'Why is the Cauca River vital to Caucasia?'},
          options:[
            {es:'Solo es una vía de transporte rápida', en:'It is only a quick transport route'},
            {es:'Provee agua, alimento, pesca y sustento económico a miles de familias', en:'Provides water, food, fishing, and economic support for thousands'},
            {es:'No influye en la vida diaria de la comunidad', en:'Has no influence on daily community life'}
          ],
          correct:1, fb:{es:'¡Correcto! El río es el corazón biológico y económico de la región.', en:'Correct! The river is the region\'s biological heart.'}, delta:6
        },
        {
          prompt:{es:'¿A qué otro gran río se une el Cauca cerca de nuestra región?', en:'Which major river does the Cauca join near our region?'},
          options:[
            {es:'Al río Nechí y luego al gran río Magdalena', en:'The Nechí River and then the Magdalena River'},
            {es:'Al océano Pacífico directamente', en:'The Pacific Ocean directly'},
            {es:'Al río Amazonas', en:'The Amazon River'}
          ],
          correct:0, fb:{es:'La cuenca Cauca-Nechí alimenta el caudal del Magdalena.', en:'The Cauca-Nechí basin feeds the Magdalena River.'}, delta:6
        }
      ]
    },
    {
      key:'l2',
      name:{es:'Nivel 2 · La Amenaza del Mercurio', en:'Level 2 · The Mercury Threat'},
      intro:{
        es:'La minería ilegal vierte mercurio al agua para extraer oro. El mercurio es un veneno invisible que daña la salud humana y ambiental.',
        en:'Illegal mining spills mercury into water to extract gold. Mercury is an invisible poison.'
      },
      type:'quiz', coinsPerCorrect:15,
      game:{
        instructions:{es:'Colecta muestras de laboratorio y esquiva los barriles de mercurio.', en:'Collect test samples and dodge mercury drums.'},
        goodColor:'#2E86AB', hazardColor:'#B23A2E',
        goodShape:'vial', hazardShape:'drum',
        goodCount:4, hazardCount:4, duration:16, goal:10, bgFrom:'#E9E2C9', bgTo:'#CBBE94'
      },
      items:[
        {
          prompt:{es:'¿Qué ocurre cuando el mercurio entra a la cadena alimenticia acuática?', en:'What happens when mercury enters the aquatic food chain?'},
          options:[
            {es:'Se evapora sin causar ningún daño', en:'Evaporates without causing damage'},
            {es:'Se bioacumula en los peces y llega a las personas que consumen pescado', en:'Bioaccumulates in fish and reaches humans who eat fish'},
            {es:'Hace que los peces naden más rápido', en:'Makes fish swim faster'}
          ],
          correct:1, fb:{es:'La bioacumulación por mercurio afecta gravemente la salud humana y la fauna.', en:'Mercury bioaccumulation severely harms human and fish health.'}, delta:8
        }
      ]
    },
    {
      key:'l3',
      name:{es:'Nivel 3 · Fauna y Pescadores', en:'Level 3 · Wildlife & Fishermen'},
      intro:{
        es:'Protege especies emblemáticas como el bocachico durante la época de subienda en el río Cauca y el río Nechí.',
        en:'Protect iconic species like bocachico during spawning seasons.'
      },
      badge:{es:'Defensor del Nechí', en:'Defender of Nechí'},
      type:'quiz',
      game:{
        instructions:{es:'Guía a los bocachicos hacia aguas seguras y evita las redes ilegales.', en:'Guide bocachico fish to safety and avoid illegal nets.'},
        goodColor:'#C9A227', hazardColor:'#4a4a4a',
        goodShape:'fish', hazardShape:'net',
        goodCount:5, hazardCount:3, duration:18, goal:12, bgFrom:'#CDEAF0', bgTo:'#8FC7D6'
      },
      items:[
        {
          prompt:{es:'¿Qué es la "subienda" para los pescadores artesanales?', en:'What is "subienda" for local artisanal fishers?'},
          options:[
            {es:'La migración masiva de peces para reproducirse en el río', en:'Mass migration of fish upriver to reproduce'},
            {es:'Una tormenta de verano', en:'A summer storm'},
            {es:'Una feria gastronómica local', en:'A local food festival'}
          ],
          correct:0, fb:{es:'Cuidar la subienda garantiza alimento y empleo responsable para el futuro.', en:'Protecting subienda ensures food security for the future.'}, delta:8
        }
      ]
    }
  ];

  var PIXEL_GRIDS = {
    drop:   ["...##...","..####..",".######.","########","########",".######.","..####..","...##..."],
    trash:  ["########","#*#..#*#","#..##..#","#.#..#.#","#.####.#","#.#..#.#","#..##..#","########"],
    vial:   ["..####..","..#**#..","..#..#..",".######.",".#*..*#.",".######.",".#*..*#.","..####.."],
    drum:   [".######.","########","#oooooo#","########","########","#oooooo#","########",".######."],
    fish:   ["...####.","..######",".######*","########","########",".#######","..######","...####."],
    net:    ["#.#.#.#.",".#.#.#.#","#.#.#.#.",".#.#.#.#","#.#.#.#.",".#.#.#.#","#.#.#.#.",".#.#.#.#"]
  };
  var PLAYER_GRID = [".oooooo.","o######o","o#*##*#o","o######o","o######o",".o####o.","..o##o..","..o##o.."];

  function drawPixelGrid(ctx, grid, x, y, r, mainColor){
    var cell = (r*2)/8, startX = x - r, startY = y - r;
    for(var row=0; row<8; row++){
      for(var col=0; col<8; col++){
        if(grid[row][col] === '.') continue;
        ctx.fillStyle = (grid[row][col]==='o') ? '#0B2B2C' : (grid[row][col]==='*') ? '#FFF' : mainColor;
        ctx.fillRect(Math.round(startX+col*cell), Math.round(startY+row*cell), Math.ceil(cell)+1, Math.ceil(cell)+1);
      }
    }
  }

  var miniGameAnim = null;
  var screenEl = document.getElementById('screen-inner');

  function render(){
    if(miniGameAnim){ cancelAnimationFrame(miniGameAnim); miniGameAnim = null; }
    if(state.levelIndex >= LEVELS.length){ renderEnding(); return; }
    var level = LEVELS[state.levelIndex];
    if(state.phase === 'intro') renderLevelIntro(level);
    else if(state.phase === 'game') renderMiniGame(level);
    else renderQuiz(level);
  }

  function renderLevelIntro(level){
    screenEl.innerHTML =
      '<div class="hero">'+
        '<div class="level-tag">'+t(level.name)+'</div>'+
        '<h2 class="title">'+t(level.intro)+'</h2>'+
        '<div class="actions-row"><button class="btn" id="start-level">'+t({es:'Comenzar nivel', en:'Start level'})+'</button></div>'+
      '</div>';
    document.getElementById('start-level').onclick = function(){
      initAudio(); startMusic();
      state.phase = 'game'; render();
    };
  }

  function renderQuiz(level){
    var q = level.items[state.stepIndex];
    var html =
      '<div class="level-tag">'+t(level.name)+'</div>'+
      '<div class="q-block">'+
        '<span class="q-count">'+t({es:'Pregunta', en:'Question'})+' '+(state.stepIndex+1)+' / '+level.items.length+'</span>'+
        '<div class="q-prompt">'+t(q.prompt)+'</div>'+
        '<div class="options">';
    q.options.forEach(function(opt, i){
      html += '<button class="opt" data-i="'+i+'">'+t(opt)+'</button>';
    });
    html += '</div><div id="fb-area"></div></div>';
    screenEl.innerHTML = html;

    var buttons = screenEl.querySelectorAll('.opt');
    buttons.forEach(function(btn){
      btn.onclick = function(){
        buttons.forEach(function(b){ b.disabled = true; });
        var i = parseInt(btn.getAttribute('data-i'),10);
        var isCorrect = (i === q.correct);
        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
        if(isCorrect){
          playSfxGood();
          applyHealth(q.delta || 6);
          addCoins(10);
        } else {
          playSfxBad();
          applyHealth(-8);
        }
        var fb = document.getElementById('fb-area');
        fb.innerHTML = '<div class="feedback'+(isCorrect?'':' bad')+'">'+t(q.fb)+'</div>'+
          '<div class="actions-row"><button class="btn" id="next-step">'+t({es:'Continuar', en:'Continue'})+'</button></div>';
        document.getElementById('next-step').onclick = function(){
          if(state.stepIndex + 1 < level.items.length){
            state.stepIndex++; renderQuiz(level);
          } else {
            playSfxLevelUp();
            state.levelIndex++; state.phase = 'intro'; state.stepIndex = 0; render();
          }
        };
      };
    });
  }

  function renderMiniGame(level){
    var cfg = level.game;
    screenEl.innerHTML =
      '<div class="level-tag">'+t(level.name)+'</div>'+
      '<h2 class="title" style="font-size:0.85rem;">'+t(cfg.instructions)+'</h2>'+
      '<div class="game-hud"><span id="mg-timer">16s</span><span id="mg-score">0 / '+cfg.goal+'</span></div>'+
      '<div class="canvas-wrap"><canvas id="mg-canvas"></canvas></div>';

    var canvas = document.getElementById('mg-canvas');
    var cssW = canvas.parentElement.clientWidth;
    var cssH = Math.round(cssW * 0.48);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW / 3);
    canvas.height = Math.round(cssH / 3);
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    var W = canvas.width, H = canvas.height;
    var player = { x: W/2, y: H/2, r: 6 };
    var items = [];
    var collected = 0, timeLeft = cfg.duration;

    function spawn(type){
      items.push({ x: Math.random()*(W-12)+6, y: Math.random()*(H-12)+6, r: 5, type: type });
    }
    for(var i=0; i<cfg.goodCount; i++) spawn('good');
    for(var j=0; j<cfg.hazardCount; j++) spawn('bad');

    function movePlayer(e){
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      player.x = Math.max(player.r, Math.min(W - player.r, (cx / rect.width) * W));
      player.y = Math.max(player.r, Math.min(H - player.r, (cy / rect.height) * H));
    }
    canvas.onpointerdown = canvas.onpointermove = movePlayer;

    var lastTs = null;
    function loop(ts){
      if(!lastTs) lastTs = ts;
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      timeLeft -= dt;

      // Habilidad Imán Ecológico
      if(state.skills.magnet){
        items.forEach(function(it){
          if(it.type === 'good'){
            var dx = player.x - it.x, dy = player.y - it.y;
            var dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 35){ it.x += (dx/dist)*25*dt; it.y += (dy/dist)*25*dt; }
          }
        });
      }

      // Colisiones
      for(var k = items.length-1; k>=0; k--){
        var it = items[k];
        var dist = Math.sqrt((it.x-player.x)*(it.x-player.x) + (it.y-player.y)*(it.y-player.y));
        if(dist < it.r + player.r){
          if(it.type === 'good'){
            collected++; addCoins(2); playSfxGood();
          } else {
            // Habilidad Escudo Anti-Mercurio
            if(state.skills.shield > 0){
              state.skills.shield--;
              playSfxGood();
            } else {
              applyHealth(-12); playSfxBad();
            }
          }
          items.splice(k, 1);
          spawn(it.type);
        }
      }

      // Render Canvas
      ctx.fillStyle = cfg.bgFrom;
      ctx.fillRect(0,0,W,H);

      items.forEach(function(it){
        var shape = (it.type==='good') ? cfg.goodShape : cfg.hazardShape;
        drawPixelGrid(ctx, PIXEL_GRIDS[shape]||PIXEL_GRIDS.drop, it.x, it.y, it.r, it.type==='good'?cfg.goodColor:cfg.hazardColor);
      });

      drawPixelGrid(ctx, PLAYER_GRID, player.x, player.y, player.r, '#0F3D3E');

      document.getElementById('mg-timer').textContent = Math.ceil(timeLeft)+'s';
      document.getElementById('mg-score').textContent = collected+' / '+cfg.goal;

      if(timeLeft <= 0){
        applyHealth(collected >= cfg.goal ? 10 : -5);
        state.phase = 'content';
        render();
        return;
      }
      miniGameAnim = requestAnimationFrame(loop);
    }
    miniGameAnim = requestAnimationFrame(loop);
  }

  function renderEnding(){
    screenEl.innerHTML =
      '<div class="level-tag">'+t({es:'Certificado de Guardián', en:'Guardian Certificate'})+'</div>'+
      '<h2 class="title">'+t({es:'¡Has completado el juego!', en:'Game Completed!'})+'</h2>'+
      '<p class="subtitle">'+t({es:'Salud final del Río Cauca: ', en:'Final River Health: '})+state.health+'/100</p>'+
      '<div class="actions-row"><button class="btn" id="restart">'+t({es:'Volver a jugar', en:'Play again'})+'</button></div>';
    document.getElementById('restart').onclick = function(){
      state.health = 70; state.coins = 30; state.levelIndex = 0; state.phase = 'intro'; updateHud(); render();
    };
  }

  updateHud();
  render();
})();
</script>
</body>
</html>
